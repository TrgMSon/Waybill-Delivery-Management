spring:
  application:
    name: tms
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tms}
    username: ${DB_USER:tms_user}
    password: ${DB_PASSWORD:tms_password}
  jpa:
    hibernate:
      ddl-auto: validate        # Hibernate chỉ kiểm tra, schema do Flyway quản lý
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          "[time_zone]": UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}            # Render cấp biến PORT khi deploy

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1800000}