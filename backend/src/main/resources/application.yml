spring:
  application:
    name: tms
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tms}
    username: ${DB_USER:tms_user}
    password: ${DB_PASSWORD:tms_password}
  jpa:
    hibernate:
      ddl-auto: validate        # Hibernate chỉ kiểm tra, schema do Flyway quản lý
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          "[time_zone]": UTC
  flyway:
    enabled: true
    locations: classpath:db/migration, classpath:db/seed

server:
  port: ${PORT:8080}            # Render cấp biến PORT khi deploy

app:
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173}

auth:
  cookie:
    secure: ${AUTH_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret-key: ${JWT_SECRET_KEY:ZGV2LW9ubHktc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi0wMTIzNDU2Nzg5}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1800000}
  refresh-token:
    expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}